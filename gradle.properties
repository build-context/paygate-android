android.useAndroidX=true

# Maven coordinate group for the published artifact.
#
# Maven Central verifies namespace ownership against a domain you control, so
# which value is legal here is not a style choice:
#   com.paygate             requires paygate.com
#   dev.paygate             requires paygate.dev
#   io.github.build-context requires only the GitHub org — always claimable
#
# GitHub Packages verifies nothing, which is why com.paygate has gone
# unchallenged there. Changing this changes the coordinate consumers import, so
# move the React Native and Flutter pins and the install docs with it.
paygate.groupId=com.paygate
